[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vidsaver"
version = "0.1.0"
description = "Fullscreen video playlist screensaver for Linux"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
vidsaver = "vidsaver.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
