# Copy to ./config.toml (next to this file) or ~/.config/vidsaver/config.toml
# or pass a path with: vidsaver --config /path/to/config.toml

video_dir = "/path/to/videos"

# primary: one fullscreen window on the first display
# all: one fullscreen window on each connected display
screens = "primary"

# true (default): --no-audio on every mpv process
# false: audio on the primary display only
mute = true

# true (default): skip the first and last 30 seconds of each file
# (intros / outros). Files 60 seconds or shorter play in full.
skip_ends = true

# Minutes on the current file before jumping to the next (default 15).
# If less than a quarter of that remains in the file, play to the end.
# Resume points persist across quit; a rename keeps the same progress.
rotate_minutes = 15

# What quits playback: "escape" (default: Escape or q) or "any-input"
# (keys, mouse buttons, and wheel). Left/Right skip files in both modes.
# The idle screensaver wrapper always passes --exit-on any-input.
exit_on = "escape"
