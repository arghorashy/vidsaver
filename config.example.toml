# Copy to ./config.toml (next to this file) or ~/.config/vidsaver/config.toml
# or pass a path with: vidsaver --config /path/to/config.toml

video_dir = "/path/to/videos"

# primary: one fullscreen window on the first display
# all: one fullscreen window on each connected display
screens = "primary"

# true (default): --no-audio on every mpv process
# false: audio on the primary display only
mute = true

# Minutes on the current file before jumping to the next (default 15).
# After a full pass in this run, each file resumes at its last offset.
# Progress is not saved when you quit.
rotate_minutes = 15

# Future (unused):
# idle_minutes = 10
# exit_on = "escape"   # later: "any-input"
